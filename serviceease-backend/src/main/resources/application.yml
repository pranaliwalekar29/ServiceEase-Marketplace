spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/serviceease}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 9090

jwt:
  secret: ${JWT_SECRET:my-super-secret-key-my-super-secret-key}
  expiration: 86400000
